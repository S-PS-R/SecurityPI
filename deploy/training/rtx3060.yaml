# Proposed FIRST run on the user's Windows RTX 3060 12 GiB, not on the Pi.
# Do not run until independent, reviewed validation data has been added.
# Invocation from an extracted dataset: yolo detect train cfg=rtx3060.yaml
model: yolo26n.pt
data: dataset.yaml
device: 0
imgsz: 640
batch: 8
workers: 0
epochs: 20
patience: 5
freeze: 10
optimizer: AdamW
lr0: 0.0001
lrf: 0.1
warmup_epochs: 1.0
warmup_bias_lr: 0.0
seed: 20261102
deterministic: true
cache: false
amp: true
rect: false
mosaic: 0.0
mixup: 0.0
cutmix: 0.0
degrees: 0.0
translate: 0.03
scale: 0.1
shear: 0.0
perspective: 0.0
flipud: 0.0
fliplr: 0.25
hsv_h: 0.015
hsv_s: 0.3
hsv_v: 0.2
save: true
save_period: -1
plots: false
project: runs/securitypi
name: pilot-01
exist_ok: false
