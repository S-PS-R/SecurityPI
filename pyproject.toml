[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "securitypi"
version = "0.2.0"
description = "Local Raspberry Pi security and parking service with Home Assistant integration"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
dependencies = [
    "fastapi==0.143.0",
    "pydantic==2.14.1",
    "uvicorn==0.54.0",
    "opencv-python-headless==4.14.0.94",
    "numpy==2.4.6",
]

[project.optional-dependencies]
dev = ["httpx==0.28.1", "pytest==9.1.1", "ruff==0.17.0"]
vision = ["lapx==0.10.0"]
onnxruntime = ["onnxruntime==1.31.1", "flatbuffers==25.12.19", "protobuf==7.36.2", "packaging==26.3"]

[tool.setuptools.package-data]
"securitypi._vendor.bytetrack" = ["LICENSE", "README.md"]

[project.scripts]
securitypi = "securitypi.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["src/securitypi/_vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
